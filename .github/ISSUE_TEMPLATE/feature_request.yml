name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or the friction in your workflow, not only the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mention how Lightroom, darktable or another tool does it, if that's useful.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
